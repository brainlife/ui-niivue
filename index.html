<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NiiVue Viewer with Controls</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 10px;
      background-color: #f0f0f0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
    }
    /* Tract selector sidebar (only shown for .tck tractograms) */
    #tractPanel {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 260px;
      max-height: 100%;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.92);
      border-right: 1px solid #ccc;
      box-sizing: border-box;
      padding: 8px;
      font-size: 12px;
      z-index: 10;
    }
    #tractPanel h4 {
      margin: 0 0 6px;
      font-size: 13px;
    }
    #tractPanel .tract-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    #tractPanel .tract-actions button {
      flex: 1;
      cursor: pointer;
      font-size: 11px;
      padding: 2px 4px;
    }
    #tractSummary {
      color: #555;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .tract-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      cursor: pointer;
    }
    .tract-swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex: 0 0 auto;
    }
    .tract-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tract-size {
      color: #888;
      flex: 0 0 auto;
    }
  </style>
</head>
<body>
  <header>
    <label for="fiberColor">Colour</label>
    <select id="fiberColor">
      <option value="global">Global direction</option>
      <option value="local">Local direction</option>
      <option value="bundle">Bundle colour</option>
      <option value="fixed">Fixed colour</option>
    </select>

    <label for="fiberColormap">Colormap</label>
    <select id="fiberColormap">
      <option value="actc">ACTC</option>
      <option value="inferno" selected>Inferno</option>
      <option value="plasma">Plasma</option>
      <option value="warm">Warm</option>
      <option value="winter">Winter</option>
    </select>

    <label for="fiberCalMin">Min</label>
    <input type="number" step="any" id="fiberCalMin" style="width:5.5em" />
    <label for="fiberCalMax">Max</label>
    <input type="number" step="any" id="fiberCalMax" style="width:5.5em" />

    <label for="fiberRadius">Radius (mm)</label>
    <input type="number" min="0.05" max="2" step="0.05" value="0.1" id="fiberRadius" style="width:4.5em" />

    <label for="fiberDecimation">Stride</label>
    <input type="number" min="1" max="20" step="1" value="1" id="fiberDecimation" style="width:3.5em" />

    <label for="fiberMinLength">Min length (mm)</label>
    <input type="number" min="0" max="200" step="1" value="0" id="fiberMinLength" style="width:4.5em" />

    <label for="fiberOpacity">Opacity</label>
    <input type="range" min="0.1" max="1" step="0.05" value="1" class="slider" id="fiberOpacity" />

    <label for="layoutSelect">Layout</label>
    <select id="layoutSelect">
      <option value="0" selected>Auto</option>
      <option value="1">Column</option>
      <option value="2">Grid</option>
      <option value="3">Row</option>
    </select>
    
    <label for="equalCheck">EqualSize</label>
    <input type="checkbox" id="equalCheck" checked />
    <label for="sliceType">View</label>
    <select id="sliceType">
      <option value="3d" selected>3D only</option>
      <option value="combined">Slices + 3D</option>
      <option value="slices">Slices only</option>
    </select>
  </header>
  <main id="canvas-container">
    <aside id="tractPanel">
      <h4>Tracts</h4>
      <div class="tract-actions">
        <button type="button" id="tractSelectAll">Select all</button>
        <button type="button" id="tractClearAll">Clear all</button>
      </div>
      <div id="tractSummary"></div>
      <div id="tractList"></div>
    </aside>
    <canvas id="gl1"></canvas>
  </main>

  <footer>
    <label id="shaders">Shaders: </label>
  </footer>

  <!-- Your bundled JavaScript file -->
  <script type="module" src="index.js" async></script>
</body>
</html>
